[workspace]
members = ["crates/domain", "crates/core", "crates/infra"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"

[package]
name = "quokka-file-manager"
version = "0.1.0"
edition = "2021"
description = "Quokka — a dual-pane file manager with F1–F12 hotkeys"

[[bin]]
name = "quokka"
path = "src/main.rs"

[dependencies]
quokka-domain = { path = "crates/domain" }
quokka-core = { path = "crates/core" }
quokka-infra = { path = "crates/infra" }
eframe = "0.29"
chrono = { workspace = true }
resvg = { version = "0.44", default-features = false }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }

[build-dependencies]
resvg = { version = "0.44", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Globalization",
] }
