[package]
name = "quokka-file-manager"
version = "0.1.0"
edition = "2021"
description = "Quokka — a dual-pane file manager with F1–F12 hotkeys"

[[bin]]
name = "quokka"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
resvg = { version = "0.44", default-features = false }
regex = "1"
flate2 = "1"
crc32fast = "1"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
] }
