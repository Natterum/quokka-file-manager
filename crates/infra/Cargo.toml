[package]
name = "quokka-infra"
version = "0.4.1"
edition = "2024"
description = "Quokka infrastructure: std::fs and Windows shell adapters for the core ports, ZIP, file search, clipboard, icons."

[dependencies]
quokka-domain = { path = "../domain" }
quokka-core = { path = "../core" }
regex = { workspace = true }
chrono = { workspace = true }
resvg = { version = "0.50", default-features = false }
fs2 = "0.4"
flate2 = "1"
crc32fast = "1"
notify = "9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico", "tiff", "tga", "qoi", "avif"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
suppaftp = { version = "13", features = ["native-tls"] }
native-tls = "0.2"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip"] }
serde_json = "1"
sha2 = "0.11"
webp = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
] }

[dev-dependencies]
libunftp = { version = "0.25", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unftp-sbe-fs = "0.4"
