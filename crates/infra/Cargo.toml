[package]
name = "quokka-infra"
version = "0.1.0"
edition = "2021"
description = "Quokka infrastructure: std::fs and Windows shell adapters for the core ports, ZIP, file search, clipboard, icons."

[dependencies]
quokka-domain = { path = "../domain" }
quokka-core = { path = "../core" }
regex = { workspace = true }
chrono = { workspace = true }
resvg = { version = "0.44", default-features = false }
fs2 = "0.4"
flate2 = "1"
crc32fast = "1"
notify = "6.1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "ico"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
suppaftp = { version = "13", features = ["native-tls"] }
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
] }

[dev-dependencies]
libunftp = { version = "0.25", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unftp-sbe-fs = "0.4"
